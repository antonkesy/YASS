<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;aspect-ratio:1/1.414">
<div style="position:absolute;inset:0;transform:{{ tf }};transition:transform .5s cubic-bezier(.2,.8,.2,1)">
<div style="position:absolute;inset:0;background:#fdfdfc;box-shadow:0 1px 2px rgba(43,43,45,.14),0 0 0 1px rgba(29,31,32,.07);border-radius:{{ rad }};overflow:hidden;container-type:inline-size;filter:{{ flt }};clip-path:{{ clip }};transition:filter .35s,clip-path .35s">
<div style="position:absolute;inset:0;clip-path:{{ reveal }}">
<sc-if value="{{ isDoc }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;padding:9cqw 10cqw;display:flex;flex-direction:column;align-items:flex-start"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="0"><div style="flex:none;box-sizing:border-box;width:{{ b.w }};height:{{ b.h }};margin-top:{{ b.mt }};background:{{ b.c }};border:{{ b.bd }};align-self:{{ b.as }}"></div></sc-for></div></sc-if>
<sc-if value="{{ isPhoto }}"><div style="position:absolute;inset:6cqw;background:repeating-linear-gradient(135deg,#dfe3e8 0 5px,#eceff2 5px 10px);display:flex;align-items:center;justify-content:center;font:500 6cqw ui-monospace,Menlo,monospace;color:#5d6166">photo</div></sc-if>
</div>
<sc-if value="{{ sweeping }}"><div style="position:absolute;left:0;right:0;bottom:0;top:{{ pct }};background:repeating-linear-gradient(0deg,#eef0f1 0 3px,#f6f7f7 3px 6px)"></div><div style="position:absolute;left:0;right:0;height:24%;top:{{ trailTop }};background:{{ trail }}"></div><div style="position:absolute;left:0;right:0;height:2px;top:{{ pct }};background:{{ barC }};box-shadow:{{ glow }}"></div></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:320},&quot;page&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,kind:string,rot:number,filter:string,crop:any}&quot;},&quot;sweep&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number|null&quot;}}">
const INK='#2f3336',INK2='#7b7f83',SOFT='#cdd0d3',ACC='#5980a6',ACC2='#d6ebff';
const FLT={original:'none',enhance:'contrast(1.25) saturate(1.2) brightness(1.03)',gray:'grayscale(1)',bw:'grayscale(1) contrast(2.6) brightness(1.15)'};
function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)||1;}
const cache={};
function build(kind,id,modern){
  const key=kind+id+(modern?'m':''); if(cache[key])return cache[key];
  const ACC=modern?'#2b63f0':'#5980a6', ACC2=modern?'#dce6ff':'#d6ebff';
  let r=hash(id); const R=()=>{r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff;};
  const b=[]; const L=(w,h,mt,c,o={})=>b.push({w:w+'cqw',h:h+'cqw',mt:mt+'cqw',c:c||SOFT,bd:o.bd||'none',as:o.as||'auto'});
  if(kind==='invoice'){
    L(80,1.4,0,ACC); L(34,3.2,5,INK); for(let i=0;i<3;i++)L(22+R()*14,1.1,1.6);
    L(80,3,7,ACC2); for(let i=0;i<7;i++)L(80,1,2.6,i%2?SOFT:'#e2e4e6');
    L(26,2.4,6,INK,{as:'flex-end'}); L(18,1,1.6,SOFT,{as:'flex-end'});
  }else if(kind==='form'){
    L(50,2.6,0,INK); L(66,1.1,1.6);
    for(let i=0;i<5;i++){L(16+R()*18,1,4.2,INK2); L(80,5,1.2,'transparent',{bd:'1px solid #c3c6c9'});}
    L(24,1,5,INK2);
  }else if(kind==='receipt'){
    L(30,2.4,4,INK,{as:'center'}); L(40,1,1.6,SOFT,{as:'center'}); L(60,0,5,'transparent',{bd:'1px dashed #b8bbbe',as:'center'});
    for(let i=0;i<9;i++)L(40+R()*20,1.1,2.4,SOFT,{as:'center'});
    L(60,0,4,'transparent',{bd:'1px dashed #b8bbbe',as:'center'}); L(44,2.2,3,INK,{as:'center'}); L(30,1,4,SOFT,{as:'center'});
  }else{
    L(9,9,0,ACC); L(26,1.3,2,INK2); for(let i=0;i<3;i++)L(24+R()*14,1.1,1.5);
    L(44,2.4,7,INK);
    for(let pgh=0;pgh<3;pgh++){const n=3+Math.floor(R()*3);for(let i=0;i<n;i++)L(i===n-1?30+R()*35:74+R()*6,1.1,i===0?4:1.9);}
    L(20,1.3,7,INK2);
  }
  return cache[key]=b;
}
class Component extends DCLogic{
  renderVals(){
    const p=this.props.page||{id:'x',kind:'letter',rot:0,filter:'original',crop:null};
    const rot=p.rot||0, odd=Math.abs(Math.round(rot/90))%2===1;
    const sw=this.props.sweep; const sweeping=typeof sw==='number';
    const pct=sweeping?Math.min(100,sw*100):100;
    const c=p.crop; const m=!!this.props.modern;
    return {
      rad:m?'6px':'0px', barC:m?'#3b82f6':'#749dc4', glow:m?'0 0 16px 6px rgba(56,189,248,.85)':'0 0 14px 5px rgba(148,188,227,.95)', trail:m?'linear-gradient(180deg,rgba(56,189,248,0),rgba(96,165,250,.35))':'linear-gradient(180deg,rgba(181,217,253,0),rgba(181,217,253,.6))',
      tf:`rotate(${rot}deg)${odd?' scale(.707)':''}`,
      flt:FLT[p.filter]||'none',
      clip:c?`inset(${c.t}% ${c.r}% ${c.b}% ${c.l}%)`:'inset(0% 0% 0% 0%)',
      reveal:`inset(0% 0% ${100-pct}% 0%)`,
      isPhoto:p.kind==='photo', isDoc:p.kind!=='photo',
      bars:p.kind==='photo'?[]:build(p.kind,p.id,m),
      sweeping, pct:pct+'%', trailTop:(pct-24)+'%'
    };
  }
}
</script>
</body>
</html>
