# Run inside `nix develop` so dotnet, nixfmt and pnpm are on PATH.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig\.json$ # JSONC with comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --scopes
          - core,fake,server,web,scanning,export,naming,nix,docker,ci,dotnet,deps

  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: dotnet-format
        name: dotnet format
        entry: dotnet format Yass.sln
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|targets|sln)$

      - id: eslint
        name: prettier + eslint (web)
        entry: pnpm --dir web run lint
        language: system
        pass_filenames: false
        files: ^web/.*\.(js|ts|svelte|json|css|html|md)$

      - id: svelte-check
        name: svelte-check (web)
        entry: pnpm --dir web run check
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|svelte)$
