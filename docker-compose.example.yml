# Example deployment next to paperless-ngx. Copy to docker-compose.yml and adjust paths.
# YASS has NO authentication: bind to a LAN address and never publish it to the internet.
services:
  yass:
    build: . # built from a checkout of this repo; no prebuilt image is published
    container_name: yass
    restart: unless-stopped
    ports:
      - "192.168.1.10:8080:8080" # LAN address of the host; not 0.0.0.0 on an internet-facing box
    volumes:
      - ./yass.yaml:/etc/yass/yass.yaml:ro
      - yass-sessions:/data/sessions
      - /srv/paperless/consume:/data/consume # paperless-ngx PAPERLESS_CONSUMPTION_DIR
    devices:
      - /dev/bus/usb:/dev/bus/usb # USB/SANE scanners; not needed for network (eSCL) scanners
    # eSCL discovery uses mDNS; host networking makes that work out of the box:
    # network_mode: host   (then drop `ports`)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s

volumes:
  yass-sessions:
