name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs inside the flake's dev shell so CI uses exactly the toolchain developers use.
env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  lint:
    name: pre-commit + hub contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Restore toolchains
        run: nix develop -c bash -c 'dotnet restore && dotnet tool restore && pnpm --dir web install --frozen-lockfile'
      - name: pre-commit
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
      - name: Hub contract matches generated TypeScript
        run: nix develop -c pnpm --dir web hub:check

  dotnet:
    name: dotnet test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build
        run: nix develop -c bash -c 'dotnet restore && dotnet build --no-restore -c Release'
      - name: Test with coverage
        run: nix develop -c dotnet test --no-build -c Release --settings coverage.runsettings --results-directory TestResults --logger "trx"
      - name: Coverage gate (80 % lines on Yass.*, excluding Yass.Fake)
        run: nix develop -c python3 scripts/coverage-gate.py --min 80
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 7

  web:
    name: web lint, check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Install
        run: nix develop -c pnpm --dir web install --frozen-lockfile
      - name: Lint
        run: nix develop -c pnpm --dir web lint
      - name: Type check
        run: nix develop -c pnpm --dir web check
      - name: Unit tests
        run: nix develop -c pnpm --dir web test
      - name: Build
        run: nix develop -c pnpm --dir web build

  e2e:
    name: playwright e2e (desktop + mobile) against --fake server
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Install
        run: nix develop -c bash -c 'dotnet restore && pnpm --dir web install --frozen-lockfile'
      - name: Browsers
        run: nix develop -c pnpm --dir web exec playwright install --with-deps chromium
      - name: E2E
        run: nix develop -c pnpm --dir web test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  desktop:
    name: desktop app for linux, windows and macos
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build web
        run: nix develop -c bash -c 'pnpm --dir web install --frozen-lockfile && pnpm --dir web build'
      # Cross-compiled from Linux: Photino ships its native parts prebuilt. Microsoft's own SDK
      # (not the dev shell's, whose Linux runtime is patched for /nix/store), with Yass.Fake's
      # fixture toolchain, as in the Dockerfile.
      - name: Publish
        run: >-
          docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c
          'apk add --no-cache pandoc-cli typst poppler-utils font-dejavu python3 &&
          TYPST_FONT_PATHS=/usr/share/fonts scripts/publish-desktop.sh dist'
      # The same native packages a release attaches (ADR-016), so a broken one shows here first.
      - name: Native packages
        run: sudo chown -R "$(id -u):$(id -g)" dist && nix develop -c scripts/package-desktop.sh dist
      - name: Nix package
        run: nix build .#desktop
      - uses: actions/upload-artifact@v7
        with:
          name: yass-desktop
          path: |
            dist/YASS-*
            dist/*.zip
          retention-days: 14

  desktop-macos:
    name: desktop tests on macos
    runs-on: macos-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Yass.Fake renders its pages at build time (ADR-012).
      - name: Fixture toolchain
        run: brew install pandoc typst poppler && brew install --cask font-dejavu
      - name: Test
        run: dotnet test tests/Yass.Desktop.Tests -c Release
