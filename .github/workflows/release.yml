name: release
# release-please tags vX.Y.Z when its PR merges; a hand-pushed v* tag releases immediately (suffix = pre-release).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR, tag and release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN works, but a PR it opens does not start ci.yml. A fine-grained PAT
          # (contents + pull requests: write) in RELEASE_PLEASE_TOKEN makes CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: attach desktop packages and android apks
    needs: release-please
    # On a tag push release-please is skipped, which would skip this too without !cancelled().
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Create the release for a pushed tag
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $pre
          fi
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build web
        run: nix develop -c bash -c 'pnpm --dir web install --frozen-lockfile && pnpm --dir web build'
      # As in ci.yml: Microsoft's own SDK, since the dev shell's Linux runtime only runs on Nix.
      - name: Publish desktop zips
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e YASS_VERSION="${TAG#v}" mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c
          'apk add --no-cache pandoc-cli typst poppler-utils font-dejavu python3 &&
          TYPST_FONT_PATHS=/usr/share/fonts scripts/publish-desktop.sh dist'
      - name: Native packages
        # The container wrote dist/ and every project's obj/ and bin/ as root; the Android build reuses those.
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          YASS_VERSION="${TAG#v}" nix develop -c scripts/package-desktop.sh dist
      - name: Android APKs
        run: YASS_VERSION="${TAG#v}" nix develop .#android -c scripts/publish-android.sh dist
      - name: Checksums
        # The macOS zip of the bare folder is dropped: the .app is how it runs there.
        run: |
          cd dist
          rm -f yass-desktop-*-osx-arm64.zip
          sha256sum YASS-* yass-desktop-*.zip yass-*-android-*.apk > SHA256SUMS
      - name: Attach to the release
        run: gh release upload "$TAG" dist/YASS-* dist/yass-desktop-*.zip dist/yass-*-android-*.apk dist/SHA256SUMS --clobber
