name: release

# Two ways to a release:
# - release-please keeps a release PR open on main, with the next version (from the
#   Conventional Commits since the last tag) and its changelog. Merging that PR tags the
#   commit vX.Y.Z and publishes the GitHub release.
# - Pushing a tag v* by hand publishes a release for it straight away, with generated notes;
#   one with a suffix (v0.1.0-alpha.1, v0.2.0-rc.1) is marked a pre-release. This is how an
#   alpha or a release candidate goes out without touching release-please's version.
# Either way the assets job then builds the desktop app at that tag and attaches it: an
# AppImage, a Windows installer and a macOS .app, plus portable zips for Linux and Windows.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR, tag and release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN works, but a PR it opens does not start ci.yml. A fine-grained PAT
          # (contents + pull requests: write) in RELEASE_PLEASE_TOKEN makes CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: attach desktop packages
    needs: release-please
    # On a tag push release-please is skipped, which would skip this too without !cancelled().
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Create the release for a pushed tag
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $pre
          fi
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build web
        run: nix develop -c bash -c 'pnpm --dir web install --frozen-lockfile && pnpm --dir web build'
      # As in ci.yml: Microsoft's own SDK, since the dev shell's Linux runtime only runs on Nix.
      - name: Publish desktop zips
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -e YASS_VERSION="${TAG#v}" mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c
          'apk add --no-cache pandoc-cli typst poppler-utils font-dejavu python3 &&
          TYPST_FONT_PATHS=/usr/share/fonts scripts/publish-desktop.sh dist'
      - name: Native packages
        # The container wrote dist/ as root. AppImage, Windows installer and macOS .app (ADR-016).
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          YASS_VERSION="${TAG#v}" nix develop -c scripts/package-desktop.sh dist
      - name: Checksums
        # The packages, plus the Linux and Windows folders zipped as portable builds; the macOS
        # zip of the bare folder is left out, the .app is the way to run it there.
        run: |
          cd dist
          rm -f yass-desktop-*-osx-arm64.zip
          sha256sum YASS-* yass-desktop-*.zip > SHA256SUMS
      - name: Attach to the release
        run: gh release upload "$TAG" dist/YASS-* dist/yass-desktop-*.zip dist/SHA256SUMS --clobber
