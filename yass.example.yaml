# YASS configuration. Copy to yass.yaml and adjust.
# Every key can also be set through the environment as YASS__section__key,
# e.g. YASS__sessions__directory=/mnt/yass.
#
# Keys outside `server:` are re-read by the ReloadConfig hub method.

server:
  listen: "0.0.0.0:8080" # LAN bind; NO AUTH — never expose publicly
  base_path: "/"

scanner:
  driver: auto # auto | sane | escl
  device: "" # NAPS2 device id or substring; empty = first found
  poll_interval_seconds: 5
  defaults:
    source: feeder # flatbed | feeder | duplex
    dpi: 300
    color: grayscale # bw | grayscale | color
    page_size: a4 # a4 | a5 | letter | legal
    brightness: 0 # -100..100
    contrast: 0 # -100..100
    blank_page_detection: true
    blank_page_threshold: 0.02 # 0..1, fraction of dark pixels
    auto_deskew: false
    # Which scanner to run on by default, by the exact id the driver reports. Empty means
    # whatever `scanner.device` above resolves to. The home screen's picker overrides it.
    device: ""
  # Deprecated and ignored: every default above can be changed from the web UI (the choice
  # is stored in the browser). Still accepted so older files keep loading.
  # ui_editable: []

# A finished document is downloaded by the browser. Set `directory` to also let browsers
# save it into one folder on the server (a paperless-ngx consume folder, say): each browser
# switches the "Save to server" button on in its Settings, and cannot pick another folder.
# Empty, or left out, keeps the server writing nothing outside sessions.directory.
output:
  directory: "" # e.g. /data/consume; must be absolute
  pdf:
    compression: jpeg # jpeg | lossless
    jpeg_quality: 75 # 1..100

processing:
  max_concurrent_renders: 2 # upper bound on decoded bitmaps in memory
  thumbnail_width: 320
  preview_max_width: 1600

sessions:
  directory: /data/sessions
  retention_hours: 24 # 0 disables cleanup

logging:
  level: info # trace | debug | info | warning | error | critical
  format: text # text | json
