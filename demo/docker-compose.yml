# One-command YAWSS demo: fake scanner, no hardware, no paperless.
#
#   cd demo && docker compose up --build   ->   http://localhost:8080
#
# Scan, reorder/rotate/delete pages, then "Save": the PDF appears
# in ./output on the host. Sessions live in the container's /tmp and are gone
# when it stops, so the demo leaves nothing behind but the PDFs.
name: yawss-demo

services:
  yawss:
    build:
      context: .. # the repo root; no prebuilt image is published
      dockerfile: Dockerfile
    container_name: yawss-demo
    # --fake swaps in the scripted scanner: 5 pages, page 3 blank, 400 ms each.
    # Other keys: pages, blank (a;b;c), error, delay, nodevice, device.
    command: ["--fake", "pages=5,blank=3,delay=400ms,device=YAWSS Demo ADF"]
    # Write ./output as you, not as the image's `yawss` account. Override if
    # your uid is not 1000:  UID=$(id -u) GID=$(id -g) docker compose up --build
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8080:8080" # localhost only; YAWSS has no authentication
    volumes:
      - ./yawss.yaml:/etc/yawss/yawss.yaml:ro
      - ./output:/data/consume
