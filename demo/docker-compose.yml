# One-command YASS demo: fake scanner, no hardware, no paperless.
#
#   cd demo && docker compose up --build              ->  http://localhost:8080
#   cd demo && YASS_PORT=9000 docker compose up --build  ->  http://localhost:9000
#
# Scan, reorder/rotate/delete pages, then "Save": the PDF appears
# in ./output on the host. Sessions live in the container's /tmp and are gone
# when it stops, so the demo leaves nothing behind but the PDFs.
name: yass-demo

services:
  yass:
    build:
      context: .. # the repo root; no prebuilt image is published
      dockerfile: Dockerfile
    container_name: yass-demo
    # --fake swaps in the scripted scanner: 5 pages, page 2 blank, 400 ms each.
    # Other keys: pages, blank (a;b;c), error, delay, nodevice, device.
    # Page 2 rather than page 3 on purpose: naming reads the first two pages that
    # are still there, and of the bundled fixtures only page 3 onwards is readable
    # by tesseract's automatic layout detection. Blanking page 2 puts a readable
    # page in reach, so Find name has something to work from.
    command: ["--fake", "pages=5,blank=2,delay=400ms,device=YASS Demo ADF"]
    # Write ./output as you, not as the image's `yass` account. Override if
    # your uid is not 1000:  UID=$(id -u) GID=$(id -g) docker compose up --build
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # localhost only; YASS has no authentication. YASS_PORT moves the host side
      # when 8080 is taken — the container always listens on 8080, so only the
      # number in front changes:  YASS_PORT=9000 docker compose up --build
      - "127.0.0.1:${YASS_PORT:-8080}:8080"
    volumes:
      - ./yass.yaml:/etc/yass/yass.yaml:ro
      - ./output:/data/consume
