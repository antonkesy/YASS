# One-command YASS demo: fake scanner, no hardware, no paperless.
#
#   cd demo && docker compose up --build              ->  http://localhost:8080
#   cd demo && YASS_PORT=9000 docker compose up --build  ->  http://localhost:9000
#   cd demo && docker compose watch                    ->  rebuilds when the source changes
#
name: yass-demo

services:
  yass:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: yass-demo
    # Fake keys: pages, blank (a;b;c), error, delay, nodevice, device, devices.
    command: ["--fake", "pages=5,blank=2,delay=400ms,device=YASS Demo ADF,devices=Epson DS-530 (USB);Canon LiDE 400 (flatbed)"]
    ports:
      # localhost only: YASS has no authentication. YASS_PORT changes only the host side.
      - "127.0.0.1:${YASS_PORT:-8080}:8080"
    # Run as you so demo/output/ files are yours; else: YASS_UID=$(id -u) YASS_GID=$(id -g) docker compose up
    user: "${YASS_UID:-1000}:${YASS_GID:-1000}"
    volumes:
      - ./yass.yaml:/etc/yass/yass.yaml:ro
      - ./output:/data/output
    # No sync: the image is a trimmed publish, so a source change means a rebuild; yass.yaml hot-reloads.
    develop:
      watch:
        - action: rebuild
          path: ../src
          ignore:
            - "**/bin/"
            - "**/obj/"
        - action: rebuild
          path: ../web
          ignore:
            - node_modules/
            - build/
            - .svelte-kit/
            - test-results/
            - playwright-report/
        - action: rebuild
          path: ../Dockerfile
        - action: rebuild
          path: ../yass.example.yaml
