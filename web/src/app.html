<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>YASS</title>
		<!--
			Light or dark before anything is painted: light unless this browser chose dark, or
			automatic (the system decides). Key and values as in $lib/appearance.svelte.ts.
		-->
		<script>
			var mode = 'light';
			try {
				mode = localStorage.getItem('yass.appearance') || 'light';
			} catch (e) {}
			if (mode !== 'auto')
				document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-page antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
