<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>YASS</title>
		<!-- Applied before first paint; key and values must match $lib/appearance.svelte.ts. -->
		<script>
			var mode = 'light';
			try {
				mode = localStorage.getItem('yass.appearance') || 'light';
			} catch (e) {}
			if (mode !== 'auto')
				document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';

			// The --vu factor in layout.css: does this engine scale vh by `zoom` (WebKit does not)?
			var probe = document.createElement('div');
			probe.style.cssText = 'position:absolute;visibility:hidden;height:100vh;zoom:2';
			document.documentElement.appendChild(probe);
			if (probe.getBoundingClientRect().height < innerHeight * 1.5)
				document.documentElement.dataset.unzoomedViewportUnits = '';
			probe.remove();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-page antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
